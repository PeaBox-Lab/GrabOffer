name: Fetch Cuelinks Deals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch deals from Cuelinks
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: node scripts/fetch-cuelinks.js
      - name: Commit updated deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          git diff --staged --quiet || git commit -m "chore: refresh cuelinks deals"
          git push